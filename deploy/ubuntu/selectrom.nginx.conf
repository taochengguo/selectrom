server {
    listen 80;
    server_name 113.250.177.180;
    return 301 https://113.250.177.180$request_uri;
}

server {
    listen 443 ssl;
    server_name 113.250.177.180;
    ssl_certificate /etc/selectrom/tls/ip.crt;
    ssl_certificate_key /etc/selectrom/tls/ip.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 25m;

    location /static/ {
        alias /opt/selectrom/current/staticfiles/;
        autoindex off;
    }

    location /media/ {
        alias /opt/selectrom/shared/media/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
