{% load static %}
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}随机抽样{% endblock %}</title>
</head>
<body>
  <header>
    <h1>{% block page_title %}随机抽样{% endblock %}</h1>
  </header>
  {% if messages %}
    <section aria-label="操作提示">
      {% for message in messages %}<p class="message {{ message.tags }}">{{ message }}</p>{% endfor %}
    </section>
  {% endif %}
  <main>
    {% block content %}{% endblock %}
  </main>
  <nav aria-label="手机端主导航">
    <a href="{% url 'mobile:dashboard' %}">随机抽样</a>
    <a href="{% url 'mobile:reminders' %}">任务提醒</a>
    <a href="{% url 'mobile:profile' %}">个人中心</a>
  </nav>
  {% block scripts %}{% endblock %}
</body>
</html>
