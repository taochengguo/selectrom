{% extends "management/base.html" %}
{% block title %}{% if group %}编辑分组{% else %}新建分组{% endif %} - 随机抽样{% endblock %}
{% block content %}
  <section class="page-card">
    <div class="page-heading"><div><h1>{% if group %}编辑分组{% else %}新建分组{% endif %}</h1><p>选择可实际承担抽样任务的抽样人员</p></div></div>
    <form class="form-card" method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="inline-actions"><button type="submit">保存</button><a class="button button--secondary" href="{% url 'personnel:group-list' %}">返回列表</a></div>
    </form>
  </section>
{% endblock %}
