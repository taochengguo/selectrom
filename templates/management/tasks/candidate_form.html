{% extends "management/base.html" %}
{% block title %}编辑候选物资 - 随机抽样{% endblock %}
{% block content %}
  <section class="page-card form-card">
    <div class="page-heading">
      <div>
        <h2>编辑候选物资</h2>
        <p>{{ task.task_number }} · {{ candidate.material_number }}</p>
      </div>
    </div>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="action-row">
        <button type="submit">保存修改</button>
        <a class="button button--secondary" href="{% url 'management:task-detail' task.pk %}">返回任务</a>
      </div>
    </form>
  </section>
{% endblock %}
