{% extends "management/base.html" %}
{% block title %}{% if task %}编辑任务{% else %}创建任务{% endif %} - 随机抽样{% endblock %}
{% block content %}
  <section class="page-card">
    <div class="page-heading">
      <div><h2>{% if task %}编辑抽样任务{% else %}创建抽样任务{% endif %}</h2><p>填写任务信息并指定抽样人员分组</p></div>
    </div>
    <form class="form-card" method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="inline-actions">
        <button type="submit">保存</button>
        {% if task %}<a class="button button--secondary" href="{% url 'management:task-detail' task.pk %}">返回任务详情</a>{% else %}<a class="button button--secondary" href="{% url 'management:task-list' %}">返回任务列表</a>{% endif %}
      </div>
    </form>
  </section>
{% endblock %}
