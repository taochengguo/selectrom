{% extends "management/base.html" %}
{% block title %}{% if task %}编辑任务{% else %}创建任务{% endif %} - 随机抽样{% endblock %}
{% block content %}
  <h2>{% if task %}编辑抽样任务{% else %}创建抽样任务{% endif %}</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">保存</button>
  </form>
  {% if task %}<a href="{% url 'management:task-detail' task.pk %}">返回任务详情</a>{% else %}<a href="{% url 'management:task-list' %}">返回任务列表</a>{% endif %}
{% endblock %}
